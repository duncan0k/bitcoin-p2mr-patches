# Job template for one build-and-test run of the P2MR patch series.
#
# This is a template, not a manifest: run-build.sh substitutes the __TOKEN__
# placeholders and applies the result. `kubectl apply -f build.yaml` on its own
# will not work, by design, because every run needs its own name.
#
# The Job runs contrib/k3s/build.sh out of the ConfigMap p2mr-build-scripts,
# which run-build.sh creates from that file. All state lives on the work PVC,
# so the Job object can be deleted as soon as its logs have been read.
#
# Resources are capped well below the node so the other workloads on the
# cluster keep their share: the node has 64 cores and 528 GB, the build takes
# 32 and 48Gi and uses -j32.
apiVersion: batch/v1
kind: Job
metadata:
  name: p2mr-build-__RUN_ID__
  namespace: p2mr-build
  labels:
    app.kubernetes.io/part-of: p2mr
    app.kubernetes.io/component: build
    p2mr.run-id: "__RUN_ID__"
spec:
  # One attempt: a failed build should be read, not silently retried.
  backoffLimit: 0
  activeDeadlineSeconds: 28800
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: p2mr
        app.kubernetes.io/component: build
        p2mr.run-id: "__RUN_ID__"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: build
          image: __BUILDER_IMAGE__
          # The image is imported straight into containerd, never pushed.
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/opt/scripts/build.sh"]
          env:
            - { name: WORK, value: "/work" }
            - { name: RUN_ID, value: "__RUN_ID__" }
            - { name: CORE_REPO, value: "https://github.com/bitcoin/bitcoin.git" }
            - { name: CORE_TAG, value: "v31.1" }
            - { name: CORE_COMMIT, value: "9be056a" }
            # "master" = the 10 consensus patches.
            # "master m05" = those plus the 24 M0.5 wallet patches.
            - { name: PATCH_SETS, value: "__PATCH_SETS__" }
            - { name: FRESH_CLONE, value: "__FRESH_CLONE__" }
            - { name: APPLY_PATCHES, value: "__APPLY_PATCHES__" }
            - { name: BUILD_JOBS, value: "__BUILD_JOBS__" }
            - { name: USE_CCACHE, value: "__USE_CCACHE__" }
            - { name: EXTRA_CMAKE_ARGS, value: "__EXTRA_CMAKE_ARGS__" }
            - { name: RUN_UNIT_TESTS, value: "__RUN_UNIT_TESTS__" }
            - { name: UNIT_TEST_ARGS, value: "__UNIT_TEST_ARGS__" }
            - { name: FUNCTIONAL_TESTS, value: "__FUNCTIONAL_TESTS__" }
            - { name: RUN_DEFAULT_FUNCTIONAL, value: "__RUN_DEFAULT_FUNCTIONAL__" }
            - { name: FUNCTIONAL_JOBS, value: "__FUNCTIONAL_JOBS__" }
            - { name: FUNCTIONAL_EXTRA_ARGS, value: "__FUNCTIONAL_EXTRA_ARGS__" }
            - { name: CCACHE_DIR, value: "/work/ccache" }
            - { name: CCACHE_MAXSIZE, value: "20G" }
          resources:
            requests: { cpu: "__CPU__", memory: "__MEMORY__" }
            limits: { cpu: "__CPU__", memory: "__MEMORY__" }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: scripts, mountPath: /opt/scripts, readOnly: true }
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: p2mr-work
        - name: scripts
          configMap:
            name: p2mr-build-scripts
            defaultMode: 0755
