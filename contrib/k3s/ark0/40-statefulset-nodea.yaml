# Node A, the block producing node.
#
# Apply only after 20-pvcs.yaml has been loaded with the existing chain. The
# volumeClaimTemplate adopts data-nodea-0 if it already exists, and creates an
# empty one if it does not, which would start a competing chain.
#
# Identical to 41-statefulset-nodeb.yaml apart from the name, the component
# label, the configuration key and the two port numbers.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nodea
  namespace: ark0
  labels:
    app.kubernetes.io/part-of: ark0
    app.kubernetes.io/component: nodea
spec:
  serviceName: ark0-nodea
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: ark0
      app.kubernetes.io/component: nodea
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ark0
        app.kubernetes.io/component: nodea
    spec:
      automountServiceAccountToken: false
      # Unprivileged, as the image intends: it creates uid and gid 10000 and
      # declares USER 10000:10000. fsGroup gives that uid group access to the
      # data volume and to the mounted Secret; OnRootMismatch stops the kubelet
      # walking a growing chain directory on every start.
      #
      # This is the default because it is what these manifests should be
      # published as, not because every cluster can run it. The one this
      # network runs on cannot: its nodes carry a BPF program attached to the
      # root cgroup at cgroup_inet_sock_create which denies socket(AF_INET) and
      # socket(AF_INET6) to uid 10000, so bitcoind starts and every bind fails
      # with
      #   [warning] libevent: socket: Operation not permitted
      #   [error] Unable to bind any endpoint for RPC server
      # AF_UNIX is unaffected, and NET_RAW, NET_ADMIN and NET_BIND_SERVICE make
      # no difference, so it is not a capability problem and no image can fix
      # it. That restriction belongs to that cluster rather than to this
      # network, so the root workaround lives in ../overlays/root-sockets/ and is
      # applied from there. Nothing else differs between the two.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Matches TimeoutStopSec=180 on the host unit: bitcoind has to finish
      # flushing its chainstate, or the next start has to reindex.
      terminationGracePeriodSeconds: 180
      containers:
        - name: bitcoind
          # The ten consensus patches and nothing else, which is exactly what
          # the host node A ran: the tree this image was built from hashes to
          # the same git tree object as ~/bitcoin-p2mr did on the host
          # (2a416c8befaab7e01762d148b6f0f181f412181f). The block producer must
          # not run a different consensus build from the chain it extends.
          image: p2mr-node-m0
          # Built in-cluster and imported into containerd; never pulled.
          imagePullPolicy: IfNotPresent
          # A node binds two ports above 1024, reads its volume and its
          # configuration, and needs nothing else the kernel can hand out.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - -conf=/config/nodea.conf
            - -datadir=/data
            - -printtoconsole
            # Expanded from the environment below, so the RPC password itself
            # never appears in a command line. rpcauth carries only a salted
            # hash, which cannot be used to authenticate.
            - -rpcauth=$(ARK0_RPCAUTH)
          env:
            - name: ARK0_RPCAUTH
              valueFrom:
                secretKeyRef:
                  name: ark0-rpc
                  key: rpcauth
          ports:
            - { name: p2p, containerPort: 38433 }
            - { name: rpc, containerPort: 38432 }
          # Answering RPC is what "ready" means for a node, and it is what makes
          # `kubectl rollout status` wait for a chain that is still loading.
          # bitcoin-cli authenticates with the cookie in the node's own data
          # directory, which bitcoind writes whether or not rpcauth is set.
          # There is deliberately no liveness probe: restarting a node that is
          # merely busy flushing costs a reindex.
          startupProbe:
            exec:
              command: ["bitcoin-cli", "-conf=/config/nodea.conf", "-datadir=/data", "uptime"]
            periodSeconds: 10
            failureThreshold: 60
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "4", memory: "8Gi" }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /config, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: ark0-conf
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
